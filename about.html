<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="About Chidinma Onyemachi, Data Analyst — professional background, analytical approach and interests.">
  <meta name="theme-color" content="#0b1220">
  <title>About | Chidinma Onyemachi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--surface:#111c2e;--surface-2:#17243a;--text:#edf4ff;--muted:#a6b5ca;--line:rgba(180,202,230,.15);--accent:#55b8f5;--accent-2:#8b9cff;--shadow:0 22px 65px rgba(0,0,0,.24)}
    [data-theme="light"]{color-scheme:light;--bg:#f5f8fc;--surface:#fff;--surface-2:#edf3fa;--text:#142238;--muted:#5c6b80;--line:rgba(32,58,89,.14);--accent:#087dbb;--accent-2:#5267d9;--shadow:0 18px 55px rgba(27,55,87,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;line-height:1.65;transition:background .25s,color .25s}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{width:min(1120px,calc(100% - 42px));margin:auto}
    .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:800 17px Manrope,sans-serif;letter-spacing:-.5px}.brand span{color:var(--accent)}.navlinks{display:flex;align-items:center;gap:22px;color:var(--muted);font-size:13px}.navlinks a:hover{color:var(--accent)}.navlinks a[aria-current="page"]{color:var(--accent);font-weight:700}.theme-btn,.menu-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 13px;cursor:pointer}.menu-btn{display:none}
    main{min-height:calc(100vh - 150px)}.hero{padding:92px 0 45px;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;width:480px;height:480px;right:-120px;top:-170px;border-radius:50%;background:radial-gradient(circle,rgba(85,184,245,.18),transparent 68%);pointer-events:none}.eyebrow{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:2px;font-size:11px}h1,h2,h3{font-family:Manrope,sans-serif;line-height:1.15;letter-spacing:-1px}h1{font-size:clamp(42px,7vw,70px);max-width:850px;margin:16px 0}.lead{font-size:19px;color:var(--muted);max-width:780px}.content{padding:22px 0 90px}.about-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:start}.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.panel{padding:27px}.panel h2{font-size:22px;margin:0 0 13px}.panel p{color:var(--muted);margin:0;white-space:pre-line}.stack{display:grid;gap:16px}.tag-list{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.tag{font-size:12px;padding:7px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}.empty-note{color:var(--muted)}footer{padding:26px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.footer-inner{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
    @media(max-width:800px){.navlinks{display:none;position:absolute;top:71px;left:0;right:0;padding:18px 22px;background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start}.navlinks.open{display:flex}.menu-btn{display:inline-block}.about-grid{grid-template-columns:1fr}}
    @media(max-width:560px){.wrap{width:min(100% - 30px,1120px)}.hero{padding:70px 0 30px}.content{padding:18px 0 65px}.panel{padding:22px}}
  </style>
</head>
<body>
<header class="topbar"><div class="wrap"><nav aria-label="Main navigation">
  <a class="brand" href="index.html#home">Chidinma<span>.</span></a>
  <div class="navlinks" id="navlinks">
    <a href="index.html#home">Home</a><a href="about.html" aria-current="page">About</a><a href="index.html#skills">Skills</a><a href="index.html#projects">Projects</a><a href="index.html#certifications">Certifications</a><a href="index.html#contact">Contact</a>
  </div>
  <div style="display:flex;gap:8px"><button class="theme-btn" id="themeToggle" type="button" aria-label="Toggle colour theme">☼ Light</button><button class="menu-btn" id="menuToggle" type="button" aria-label="Open navigation">☰</button></div>
</nav></div></header>
<main>
  <section class="hero"><div class="wrap"><div class="eyebrow">A little about me</div><h1 id="aboutHeadline">About me</h1><p class="lead" id="aboutIntroduction"></p></div></section>
  <section class="content"><div class="wrap about-grid">
    <div class="stack" id="aboutMain"></div>
    <aside class="stack" id="aboutAside"></aside>
  </div></section>
</main>
<footer><div class="wrap footer-inner"><span>© <span id="year"></span> Chidinma Onyemachi</span><a href="index.html">Back to home ↑</a></div></footer>
<script>
const root=document.documentElement,themeToggle=document.getElementById("themeToggle"),savedTheme=localStorage.getItem("portfolio-theme");
if(savedTheme)root.dataset.theme=savedTheme;
function updateThemeButton(){themeToggle.textContent=root.dataset.theme==="dark"?"☼ Light":"☾ Dark"}
updateThemeButton();themeToggle.addEventListener("click",()=>{root.dataset.theme=root.dataset.theme==="dark"?"light":"dark";localStorage.setItem("portfolio-theme",root.dataset.theme);updateThemeButton()});
document.getElementById("menuToggle").addEventListener("click",()=>document.getElementById("navlinks").classList.toggle("open"));
document.querySelectorAll("#navlinks a").forEach(a=>a.addEventListener("click",()=>document.getElementById("navlinks").classList.remove("open")));
document.getElementById("year").textContent=new Date().getFullYear();
function addPanel(container,title,body){if(!body||!String(body).trim())return;const panel=document.createElement("article");panel.className="panel";const heading=document.createElement("h2");heading.textContent=title;const paragraph=document.createElement("p");paragraph.textContent=body;panel.append(heading,paragraph);container.appendChild(panel)}
function addListPanel(container,title,items){if(!Array.isArray(items)||!items.length)return;const panel=document.createElement("article");panel.className="panel";const heading=document.createElement("h2");heading.textContent=title;const list=document.createElement("div");list.className="tag-list";items.filter(Boolean).forEach(item=>{const tag=document.createElement("span");tag.className="tag";tag.textContent=item;list.appendChild(tag)});panel.append(heading,list);container.appendChild(panel)}
async function loadAbout(){try{const response=await fetch("data/about.json",{cache:"no-store"});if(!response.ok)throw new Error("About content could not be loaded");const about=await response.json();const profileResponse=await fetch("data/profile.json",{cache:"no-store"});if(profileResponse.ok){const profile=await profileResponse.json();if(profile.name)document.querySelector(".brand").innerHTML=profile.name+"<span>.</span>";document.querySelector("footer .footer-inner span").textContent="© "+new Date().getFullYear()+" "+(profile.name||"")};document.title=(about.headline||"About")+" | Chidinma Onyemachi";document.getElementById("aboutHeadline").textContent=about.headline||"About me";document.getElementById("aboutIntroduction").textContent=about.introduction||"";const main=document.getElementById("aboutMain"),aside=document.getElementById("aboutAside");addPanel(main,"Professional background",about.professionalBackground);addPanel(main,"My approach to data",about.approach);addPanel(aside,"Career goals",about.careerGoals);addListPanel(aside,"Areas of interest",about.areasOfInterest);addListPanel(aside,"Professional strengths",about.strengths);if(!main.children.length&&!aside.children.length)main.appendChild(Object.assign(document.createElement("p"),{className:"empty-note",textContent:"About information will be added soon."}))}catch(error){console.error(error);document.getElementById("aboutIntroduction").textContent="About information is temporarily unavailable."}}
loadAbout();
</script>
</body></html>
