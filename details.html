<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Project and certification details — Chidinma Onyemachi">
  <title>Portfolio details | Chidinma Onyemachi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--surface:#111c2e;--surface-2:#17243a;--text:#edf4ff;--muted:#a6b5ca;--line:rgba(180,202,230,.15);--accent:#55b8f5;--accent-2:#8b9cff;--shadow:0 22px 65px rgba(0,0,0,.24)}
    [data-theme="light"]{color-scheme:light;--bg:#f5f8fc;--surface:#fff;--surface-2:#edf3fa;--text:#142238;--muted:#5c6b80;--line:rgba(32,58,89,.14);--accent:#087dbb;--accent-2:#5267d9;--shadow:0 18px 55px rgba(27,55,87,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 "DM Sans",sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(980px,calc(100% - 42px));margin:auto}.topbar{border-bottom:1px solid var(--line);background:var(--surface)}nav{min-height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font:800 17px Manrope,sans-serif}.brand span{color:var(--accent)}.nav-actions{display:flex;gap:12px;align-items:center}.back,.theme-btn,.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface-2);color:var(--text);font-weight:700;font-size:13px}.theme-btn{border-radius:999px;cursor:pointer}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.content{padding:58px 0 90px}.content h1{font:800 clamp(32px,6vw,52px)/1.12 Manrope,sans-serif;letter-spacing:-1.5px;margin:12px 0}.meta{color:var(--muted);margin:0 0 24px}.hero-image{width:100%;max-height:620px;object-fit:contain;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}.image-caption{color:var(--muted);font-size:12px;margin:9px 0 30px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.detail-section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}.detail-section.full{grid-column:1/-1}.detail-section h2{font:700 19px Manrope,sans-serif;margin:0 0 12px}.detail-section p{color:var(--muted);margin:0;white-space:pre-line}.detail-section ul{margin:0;padding-left:20px;color:var(--muted)}.detail-section li+li{margin-top:7px}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{background:var(--surface-2);border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-size:12px;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.btn.primary{background:var(--accent);color:#061321;border-color:var(--accent)}.error{padding:70px 0;color:var(--muted)}footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:12px}@media(max-width:650px){.detail-grid{grid-template-columns:1fr}.detail-section.full{grid-column:auto}.content{padding-top:38px}.wrap{width:calc(100% - 30px)}}
  </style>
</head>
<body>
<header class="topbar"><div class="wrap"><nav><a class="brand" href="index.html">Chidinma<span>.</span></a><div class="nav-actions"><a class="back" href="index.html#projects">← Back to portfolio</a><button class="theme-btn" id="themeToggle" type="button">☼ Light</button></div></nav></div></header>
<main class="wrap content" id="detailContent"><p class="error">Loading details…</p></main>
<footer><div class="wrap">© <span id="year"></span> Chidinma Onyemachi</div></footer>
<script>
const root=document.documentElement,toggle=document.getElementById("themeToggle"),saved=localStorage.getItem("portfolio-theme");if(saved)root.dataset.theme=saved;function updateTheme(){toggle.textContent=root.dataset.theme==="dark"?"☼ Light":"☾ Dark"}updateTheme();toggle.addEventListener("click",()=>{root.dataset.theme=root.dataset.theme==="dark"?"light":"dark";localStorage.setItem("portfolio-theme",root.dataset.theme);updateTheme()});document.getElementById("year").textContent=new Date().getFullYear();
</script>
<script src="details.js"></script>
</body>
</html>
