<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Project and certification details — Chidinma Onyemachi">
  <title>Portfolio details | Chidinma Onyemachi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--surface:#111c2e;--surface-2:#17243a;--text:#edf4ff;--muted:#a6b5ca;--line:rgba(180,202,230,.15);--accent:#55b8f5;--accent-2:#8b9cff;--shadow:0 22px 65px rgba(0,0,0,.24)}
    [data-theme="light"]{color-scheme:light;--bg:#f5f8fc;--surface:#fff;--surface-2:#edf3fa;--text:#142238;--muted:#5c6b80;--line:rgba(32,58,89,.14);--accent:#087dbb;--accent-2:#5267d9;--shadow:0 18px 55px rgba(27,55,87,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 "DM Sans",sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1040px,calc(100% - 42px));margin:auto}
    .topbar{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px)}nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font:800 17px Manrope,sans-serif}.brand span{color:var(--accent)}.nav-actions{display:flex;gap:12px;align-items:center}.back,.theme-btn,.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface-2);color:var(--text);font-weight:700;font-size:13px}.theme-btn{border-radius:999px;cursor:pointer;font:700 13px "DM Sans",sans-serif}
    .content{padding:56px 0 90px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.content h1{font:800 clamp(32px,6vw,54px)/1.12 Manrope,sans-serif;letter-spacing:-1.5px;margin:12px 0 14px;max-width:850px}.intro{max-width:780px;color:var(--muted);font-size:16px;margin:0 0 24px}.meta-row{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 28px}.meta-chip,.tag{background:var(--surface-2);border:1px solid var(--line);padding:6px 11px;border-radius:999px;font-size:12px;color:var(--muted)}
    .preview{margin:30px 0 34px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}.preview img{display:block;width:100%;max-height:650px;object-fit:contain;border-radius:12px;background:var(--surface-2);cursor:zoom-in}.preview.cert-preview{max-width:760px;margin-inline:auto}.preview.cert-preview img{max-height:780px}.preview-caption{font-size:12px;color:var(--muted);margin:11px 4px 0}.no-image{min-height:190px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px;background:var(--surface);border:1px dashed var(--line);border-radius:16px;margin:28px 0}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:28px}.detail-section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:23px;min-width:0}.detail-section.full{grid-column:1/-1}.detail-section h2{font:700 19px/1.3 Manrope,sans-serif;margin:0 0 12px;letter-spacing:-.3px}.detail-section p{color:var(--muted);margin:0;white-space:pre-line}.detail-section ul{margin:0;padding-left:21px;color:var(--muted)}.detail-section li+li{margin-top:8px}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{display:inline-flex}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gallery a{display:block;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px}.gallery img{display:block;width:100%;height:210px;object-fit:contain;border-radius:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.btn{transition:transform .18s,border-color .18s}.btn:hover{transform:translateY(-2px);border-color:var(--accent)}.btn.primary{background:var(--accent);color:#061321;border-color:var(--accent)}.error{padding:70px 0;color:var(--muted)}footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:12px}
    @media(max-width:650px){.detail-grid{grid-template-columns:1fr}.detail-section.full{grid-column:auto}.content{padding-top:38px}.wrap{width:calc(100% - 30px)}.preview{padding:9px;border-radius:15px}.preview img{max-height:440px}.preview.cert-preview img{max-height:600px}.gallery{grid-template-columns:1fr}.gallery img{height:190px}.back{padding:9px 10px;font-size:12px}}
  </style>
</head>
<body>
<header class="topbar"><div class="wrap"><nav><a class="brand" href="index.html">Chidinma<span>.</span></a><div class="nav-actions"><a class="back" id="backLink" href="index.html#projects">← Back to portfolio</a><button class="theme-btn" id="themeToggle" type="button">☼ Light</button></div></nav></div></header>
<main class="wrap content" id="detailContent"><p class="error">Loading details…</p></main>
<footer><div class="wrap">© <span id="year"></span> Chidinma Onyemachi</div></footer>
<script>
const root=document.documentElement,toggle=document.getElementById("themeToggle"),saved=localStorage.getItem("portfolio-theme");if(saved)root.dataset.theme=saved;function updateTheme(){toggle.textContent=root.dataset.theme==="dark"?"☼ Light":"☾ Dark"}updateTheme();toggle.addEventListener("click",()=>{root.dataset.theme=root.dataset.theme==="dark"?"light":"dark";localStorage.setItem("portfolio-theme",root.dataset.theme);updateTheme()});document.getElementById("year").textContent=new Date().getFullYear();
</script>
<script src="details.js"></script>
</body>
</html>
