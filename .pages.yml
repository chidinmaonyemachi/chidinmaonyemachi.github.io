
media:
  input: assets/uploads
  output: /assets/uploads
  categories:
    - image
  extensions:
    - jpg
    - jpeg
    - png
    - webp

content:
  - name: profile
    label: Profile
    type: file
    path: data/profile.json
    format: json
    fields:
      - name: name
        label: Full name
        type: string
      - name: headline
        label: Professional headline
        type: string
      - name: biography
        label: About me
        type: text
      - name: photo
        label: Profile photograph
        type: image
      - name: location
        label: Location
        type: string

  - name: contact
    label: Contact
    type: file
    path: data/contact.json
    format: json
    fields:
      - name: email
        label: Professional email
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string
      - name: github
        label: GitHub URL
        type: string
      - name: tableau
        label: Tableau Public URL
        type: string
      - name: youtube
        label: YouTube URL
        type: string
      - name: otherLinks
        label: Other links
        type: string
        list: true

  - name: settings
    label: Website settings
    type: file
    path: data/settings.json
    format: json
    fields:
      - name: showAbout
        label: Show About section
        type: boolean
      - name: showProjects
        label: Show Projects section
        type: boolean
      - name: showSkills
        label: Show Skills section
        type: boolean
      - name: showCertifications
        label: Show Certifications section
        type: boolean
      - name: showExperience
        label: Show Experience section
        type: boolean
      - name: showContact
        label: Show Contact section
        type: boolean
      - name: introduction
        label: Homepage introduction
        type: text

  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename: "{primary}.json"
    view:
      primary: title
    fields:
      - name: title
        label: Project title
        type: string
      - name: category
        label: Category
        type: string
      - name: description
        label: Description
        type: text
      - name: overview
        label: Detailed project overview
        type: text
      - name: businessProblem
        label: Problem or business question
        type: text
      - name: objectives
        label: Project objectives
        type: text
        list: true
      - name: dataset
        label: Dataset and scope
        type: text
      - name: methodology
        label: Methodology and workflow
        type: text
        list: true
      - name: keyFindings
        label: Key findings
        type: text
        list: true
      - name: recommendations
        label: Recommendations
        type: text
        list: true
      - name: outcome
        label: Outcome and learning
        type: text
      - name: additionalImages
        label: Additional project screenshots
        type: image
        list: true
      - name: tools
        label: Tools and technologies
        type: string
        list: true
      - name: image
        label: Project screenshot
        type: image
      - name: githubUrl
        label: GitHub URL
        type: string
      - name: dashboardUrl
        label: Dashboard URL
        type: string
      - name: caseStudyUrl
        label: Case study URL
        type: string
      - name: featured
        label: Feature on homepage
        type: boolean
      - name: published
        label: Published
        type: boolean

  - name: skills
    label: Skills
    type: collection
    path: content/skills
    format: json
    filename: "{primary}.json"
    view:
      primary: name
    fields:
      - name: name
        label: Entry title (used to identify this skill group)
        type: string
      - name: keySkills
        label: Key Skills & Tools
        type: object
        list: true
        fields:
          - name: skillName
            label: Skill Name
            type: string
          - name: category
            label: Category
            type: string
          - name: purpose
            label: Primary Purpose
            type: text

  - name: certifications
    label: Certifications
    type: collection
    path: content/certifications
    format: json
    filename: "{primary}.json"
    view:
      primary: name
    fields:
      - name: name
        label: Certificate name
        type: string
      - name: issuer
        label: Issuing organisation
        type: string
      - name: date
        label: Date obtained (Month Year, e.g. January 2026)
        type: string
      - name: credentialUrl
        label: Credential URL
        type: string
      - name: description
        label: Certificate description
        type: text
      - name: skillsGained
        label: Skills or topics covered
        type: string
        list: true
      - name: image
        label: Certificate image
        type: image

settings:
  content:
    merge: true
